# =============================================================================
# .github/workflows/ci.yml — Feature Flag Service CI
#
# Two jobs:
#   1. test          — runs on every push and every PR (all branches)
#   2. build-and-push — runs only on push to main, only after test passes
#
# Test database strategy: Option A — ephemeral service containers.
#   - Postgres and Redis are spun up fresh inside the GitHub Actions runner for
#     the duration of the job, then torn down.  No real Neon credentials are
#     needed here; no real data is at risk.  The JWT_SECRET_KEY used is
#     throwaway and never protects anything real.
#   - The trade-off chosen explicitly: ephemeral containers are NOT literally
#     Neon, but this service uses no Neon-specific features (standard Postgres
#     throughout), so the difference is irrelevant in practice.
#   - Real Neon DATABASE_URL only becomes relevant in Step 10+ (Kubernetes
#     secrets for the actual deployed environment).  If you ever find yourself
#     adding DATABASE_URL as a GitHub secret for this job, stop — that would
#     mean Option B was silently chosen instead.
#
# GHCR image tagging strategy:
#   - Primary tag: git commit SHA — immutable, always traceable to exact source.
#   - Convenience tag: `latest` — mutable, fine for local pulls.
#   - Argo CD (Step 10+) should reference the SHA tag, never `latest`, since
#     `latest` can silently point to a different image after each push.  This
#     is standard GitOps practice: the deployment manifest pins an exact digest,
#     not a moving tag.
# =============================================================================

name: CI

on:
  push:
    # Run tests on every push to any branch.
    # build-and-push is gated to main only (see that job's `if:` condition).
    branches: ["**"]
  pull_request:
    # Also run tests on PRs targeting any branch.
    branches: ["**"]

# ---------------------------------------------------------------------------
# Job 1 — test
# Runs on every push and every pull_request.
# Uses ephemeral Postgres + Redis service containers (Option A decision above).
# ---------------------------------------------------------------------------
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # Service containers — these run as sibling containers alongside the job's
    # runner container.  GitHub Actions exposes them on `localhost` inside the
    # runner via the mapped ports.  They are torn down automatically when the
    # job finishes.
    #
    # Health checks are required — without them, steps that run immediately
    # after the job starts could attempt to connect before the container is
    # ready, producing spurious connection-refused failures.  This is the same
    # reasoning as `depends_on: condition: service_healthy` in docker-compose.
    # -------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials — this DB only exists for the duration of the run.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: feature_flags_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        # Same tag used in docker-compose.yml — consistent across local dev and CI.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1 — Checkout the code at the ref that triggered this workflow.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Set up Python, pinned to the same minor version as the
      # Dockerfile (python:3.12-slim), so CI and the built image use identical
      # interpreter behaviour.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3 — Install runtime + dev dependencies.
      # requirements.txt — runtime deps, same as what the Dockerfile installs.
      # requirements-dev.txt — test-only deps (pytest, httpx for TestClient).
      # These are split so the Dockerfile never installs pytest into the image.
      - name: Install runtime dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install dev/test dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      # Step 4 — Provide environment variables for this job.
      # These point at the ephemeral service containers defined above.
      # GITHUB_ENV persists these into all subsequent steps in this job.
      #
      # IMPORTANT: JWT_SECRET_KEY here is explicitly throwaway — it never
      # protects a real deployed environment, so it does not need to be a
      # GitHub secret.  Real secrets belong in Kubernetes (Step 10+), not here.
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:5432/feature_flags_ci" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-throwaway-key-not-used-in-production" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> $GITHUB_ENV
          # PYTHONPATH=. makes `from app.xxx import ...` resolvable from the
          # project root.  Without this, pytest on the CI runner cannot find
          # the `app` package because it isn't installed — it's just a directory.
          # This matches what happens locally when pytest is run from the repo root.
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      # Step 5 — Run Alembic migrations against the fresh, empty ephemeral
      # Postgres.  This is a dual-purpose step:
      #   a) It sets up the schema so subsequent tests have tables to work with.
      #   b) It is itself a test of the migration files — proving they apply
      #      cleanly to a genuinely empty database, not one that already had
      #      schema from a previous Alembic run (as Neon did after Step 1).
      #      If this step fails, it means a migration has an implicit dependency
      #      on pre-existing state that Alembic's own history doesn't capture —
      #      a real bug worth catching here rather than when someone else clones
      #      this repo.
      - name: Run Alembic migrations
        run: alembic upgrade head

      # Step 6 — Run the full pytest suite.
      # pytest exits non-zero on any failure by default; we do not add any
      # shell pipes or redirects here that could mask that exit code.
      # -v gives per-test output in the Actions log for easier debugging.
      # --tb=short keeps tracebacks readable without flooding the log.
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2 — build-and-push
  # Runs ONLY on push to main, AND only after the test job passes.
  #
  # The `needs: test` line is the single most important property of the whole
  # pipeline: a red test run makes it structurally impossible to produce a new
  # image.  The job won't even start if `test` failed; it appears as "skipped"
  # in the Actions UI, not "attempted and failed".
  #
  # The `if:` condition independently gates on the branch — even if somehow
  # `needs` were removed, a PR push would not trigger a push to GHCR.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    # Only runs on direct pushes to main — not on pull_request events (those
    # don't push images; we don't want an image per draft feature commit) and
    # not on pushes to other branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # -------------------------------------------------------------------------
    # Explicit permissions declaration — required for GHCR push.
    # Without `packages: write` here, the built-in GITHUB_TOKEN does not have
    # permission to push to the GitHub Container Registry, even though the
    # token itself exists automatically.  This is a deliberate GitHub security
    # model: jobs must opt in to elevated permissions rather than having them
    # by default.
    # -------------------------------------------------------------------------
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1 — Checkout, same as test job.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Log in to GHCR using the automatically-provided GITHUB_TOKEN.
      # No separate secret is needed: the built-in token already has the right
      # scope for GHCR when `permissions: packages: write` is set above.
      # The registry is ghcr.io; the username is the GitHub actor who triggered
      # the push; the password is the built-in token.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3 — Derive image name and tags.
      #
      # Image name convention: ghcr.io/<owner>/<repo>
      # github.repository is already "<owner>/<repo>", so we lowercase it
      # (GHCR requires lowercase image names) and prepend "ghcr.io/".
      #
      # Tags produced:
      #   ghcr.io/<owner>/<repo>:<sha>   <- primary, immutable, deployment-safe
      #   ghcr.io/<owner>/<repo>:latest  <- convenience only, NOT for Argo CD
      #
      # The SHA tag is what Argo CD (Step 10+) should reference in the
      # Deployment manifest's image field.  `latest` is convenient for
      # `docker pull` locally but silently shifts after every push — using it
      # in a GitOps deployment manifest defeats the entire point of immutable
      # image references.
      - name: Derive image name and tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="${IMAGE_NAME}:${{ github.sha }}"
          LATEST_TAG="${IMAGE_NAME}:latest"
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      # Step 4 — Build the image using the multi-stage Dockerfile from Step 8.
      # We build once, producing a local image with both tags, then push both
      # in step 5.  Building once avoids any possibility of a tag pointing to
      # a different build than the other.
      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.sha_tag }}" \
            --tag "${{ steps.meta.outputs.latest_tag }}" \
            .

      # Step 5 — Push both tags to GHCR.
      # After this step, the image is visible in your GitHub repo's Packages
      # tab.  The SHA-tagged image is what a deployment system should reference.
      - name: Push Docker image to GHCR
        run: |
          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.latest_tag }}"

      # Step 6 — Print a summary of what was pushed for easy reference in the
      # Actions log.  The SHA tag is the one to copy for Argo CD / kubectl.
      - name: Print image references
        run: |
          echo "===== Image pushed to GHCR ====="
          echo "SHA tag (use for deployment):  ${{ steps.meta.outputs.sha_tag }}"
          echo "Latest tag (convenience only): ${{ steps.meta.outputs.latest_tag }}"
          echo ""
          echo "To pull locally:"
          echo "  docker pull ${{ steps.meta.outputs.sha_tag }}"
          echo ""
          echo "NOTE: For Argo CD (Step 10+), reference the SHA tag above —"
          echo "never the 'latest' tag, which moves on every push."
